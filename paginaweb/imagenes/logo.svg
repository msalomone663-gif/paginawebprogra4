<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <defs>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="100%" stop-color="#F5B300" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="100%" stop-color="#D63031" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Balanza de la justicia estilizada -->
  <g transform="translate(10, 15) scale(0.9)" stroke="#F5B300" stroke-width="2.5" fill="none" stroke-linecap="round">
    <!-- Eje central -->
    <line x1="25" y1="4" x2="25" y2="52" />
    <!-- Base -->
    <path d="M12 52 L38 52" stroke-width="3" />
    <!-- Brazo oscilante un poco chueco/inclinado (estilo Saul) -->
    <line x1="6" y1="16" x2="44" y2="12" stroke-width="3" />
    <!-- Platillo izquierdo -->
    <line x1="6" y1="16" x2="0" y2="34" />
    <line x1="6" y1="16" x2="12" y2="34" />
    <path d="M-2 34 Q6 40 14 34 Z" fill="#F5B300" />
    <!-- Platillo derecho (más cargado) -->
    <line x1="44" y1="12" x2="38" y2="30" />
    <line x1="44" y1="12" x2="50" y2="30" />
    <path d="M36 30 Q44 36 52 30 Z" fill="#F5B300" />
  </g>

  <!-- Tipografía Better Call Saul -->
  <g filter="url(#shadow)">
    <text x="68" y="32" font-family="'Impact', 'Arial Black', sans-serif" font-style="italic" font-size="28" fill="url(#yellowGrad)" letter-spacing="1">
      BETTER CALL
    </text>
    <text x="70" y="65" font-family="'Impact', 'Arial Black', sans-serif" font-style="italic" font-size="34" fill="url(#redGrad)" letter-spacing="2">
      SAUL
    </text>
    <!-- Subtítulo jurídico -->
    <text x="160" y="62" font-family="'Arial', sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" letter-spacing="3" opacity="0.9">
      ATTORNEY AT LAW
    </text>
  </g>
</svg>
